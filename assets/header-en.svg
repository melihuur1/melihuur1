  <text x="306" y="60" textLength="202" lengthAdjust="spacing" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#67E8F9">SOFTWARE DEVELOPER</text>

  <text x="400" y="146" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-1" fill="url(#name)">Melih</text>
